plugins {
    id 'java'
    id 'jacoco'
    id 'org.sonarqube' version '4.4.1.3373'
}

group = 'com.bevans.kafka'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

final def CONNECT_VERSION = '3.5.0'

dependencies {
    implementation 'org.json:json:20240303'
    implementation("org.apache.kafka:connect-api:$CONNECT_VERSION")
    compileOnly("org.apache.kafka:connect-transforms:$CONNECT_VERSION")

    //
    // Unit test dependencies
    //
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation("org.apache.kafka:connect-transforms:$CONNECT_VERSION")
}

jar {
    archiveClassifier = 'SMT'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
    }
}
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.9
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.8
            }
        }
    }
}

sonar {
    properties {
        property "sonar.projectKey", "bazzani_kafka-connect-stack"
        property("sonar.organization", "bazzani-github")
        property "sonar.host.url", "https://sonarcloud.io"
        property("sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml")
        property("sonar.junit.reportPaths", "build/test-results/test")
    }
}
