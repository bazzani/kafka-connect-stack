plugins {
    id 'bevans.java-conventions'
    id 'java-library'
}

ext {
    connectVersion = '3.7.0'
    jsonVersion = '20240303'
}

dependencies {
    api("org.apache.kafka:connect-api:${connectVersion}")

    implementation("org.apache.kafka:connect-transforms:${connectVersion}")
    implementation("org.json:json:${jsonVersion}")
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
    }
}
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = project.jacocoMinLine;
            }
            limit {
                counter = 'BRANCH'
                minimum = project.jacocoMinBranch;
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}
